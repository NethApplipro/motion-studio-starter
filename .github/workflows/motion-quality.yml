# Qualité motion. Ne contrôle que les films touchés par la PR (scripts/ci-plan.mjs), à deux niveaux :
#   PR en brouillon        → contrôle léger : précontrôle (une image sur cinq), sans rendu MP4
#   PR prête ou lancement manuel → validation complète : rendu, QA finale image par image, déterminisme, verdict
#   Film en ébauche (brief « Étape : ébauche ») → toujours le contrôle léger, sur son seul format maître
# Une modification de code partagé (briques, capteurs, charte, scripts) relance tous les films ; la doc seule, aucun.
name: Qualité motion
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_films: ${{ steps.plan.outputs.has_films }}
      visual: ${{ steps.plan.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE=complet; RANGE=""; else RANGE="$BASE HEAD"; if [ "$DRAFT" = "true" ]; then MODE=leger; else MODE=complet; fi; fi
          PLAN=$(node scripts/ci-plan.mjs $RANGE --mode=$MODE)
          echo "$PLAN"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "matrix=$(echo "$PLAN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify({include:JSON.parse(s).matrix})))')" >> "$GITHUB_OUTPUT"
          echo "has_films=$(echo "$PLAN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).matrix.length>0))')" >> "$GITHUB_OUTPUT"
          echo "visual=$(echo "$PLAN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).visual))')" >> "$GITHUB_OUTPUT"
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  validate:
    needs: plan
    if: needs.plan.outputs.has_films == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - name: Contrôle léger (précontrôle, sans MP4)
        if: matrix.niveau == 'leger'
        run: npm run qa -- ${{ matrix.film }} ${{ matrix.format }} --preflight
      - name: Rendu
        if: matrix.niveau == 'complet'
        run: npm run render -- ${{ matrix.film }} ${{ matrix.format }}
      - name: Validation finale
        if: matrix.niveau == 'complet'
        run: npm run qa -- ${{ matrix.film }} ${{ matrix.format }}
      - name: Déterminisme
        if: matrix.niveau == 'complet'
        run: npm run determinism -- ${{ matrix.film }}-${{ matrix.format }}
      # Verdict calculé : QA finale de ce format + critique committée (review.json) selon la cible du film.
      - name: Verdict
        if: matrix.niveau == 'complet'
        run: npm run verdict -- ${{ matrix.film }} ${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.film }}-${{ matrix.format }}
          path: |
            out/${{ matrix.film }}-${{ matrix.format }}.mp4
            reviews/${{ matrix.film }}-${{ matrix.format }}/*.md
            reviews/${{ matrix.film }}-${{ matrix.format }}/*.json
          if-no-files-found: ignore
          retention-days: 7
  visual:
    needs: plan
    if: needs.plan.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diff-visuel
          path: |
            tests/visual/diff/
            tests/visual/actual/
          retention-days: 7
